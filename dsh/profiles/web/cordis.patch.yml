# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
        # The shipped pi-ai catalog declares these at contextWindow 1000000 with
        # maxTokens 384000, which drives compaction-basic to a 550,464-token trigger
        # (1000000 - 384000 - 65536 headroom) and reserves 384k of output per request.
        # These overrides pin them to values that reproduce an exact 256,000-token
        # compaction trigger:
        #   354304 - 32768 - 65536 = 256000
        # modelOverrides reshapes named catalog models in place and leaves the other
        # 27 in the catalog untouched — unlike `models:`, which would replace it.
        # Fixing contextWindow at the source also keeps the context meter, image
        # budgets, and overflow detection from seeing an advertised 1M we never use.
        modelOverrides:
          deepseek-v4.1-flash:
            contextWindow: 354304
            maxTokens: 32768
          deepseek-v4-flash:
            contextWindow: 354304
            maxTokens: 32768
          deepseek-v4-pro:
            contextWindow: 354304
            maxTokens: 32768
          muse-spark-1.3-contributor:
            # Catalog: contextWindow 1048576, maxTokens 131072. Pinned for the same
            # reason as its siblings.
            contextWindow: 354304
            maxTokens: 32768
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: max
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    fontSize: 15
# The tool ships in the dsh-pdf-markdown bundle; this row only says where the
# worker lives. `elitedesk` is a Tailscale MagicDNS name, so it resolves only
# inside the tailnet and is useless to anyone reading this file.
- id: pdf-markdown
  name: dsh-pdf-markdown
  config:
    url: http://elitedesk:8765
