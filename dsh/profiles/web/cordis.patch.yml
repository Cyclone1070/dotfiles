# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
        # The shipped pi-ai catalog declares these at contextWindow 1000000 with
        # maxTokens 384000, which drives compaction-basic to a 550,464-token trigger
        # (1000000 - 384000 - 65536 headroom) and reserves 384k of output per request.
        # These overrides pin them to the same values the free route uses, which
        # reproduces an exact 256,000-token compaction trigger:
        #   354304 - 32768 - 65536 = 256000
        # modelOverrides reshapes named catalog models in place and leaves the other
        # 27 in the catalog untouched — unlike `models:`, which would replace it.
        # Fixing contextWindow at the source also keeps the context meter, image
        # budgets, and overflow detection from seeing an advertised 1M we never use.
        modelOverrides:
          deepseek-v4.1-flash:
            contextWindow: 354304
            maxTokens: 32768
          deepseek-v4-flash:
            contextWindow: 354304
            maxTokens: 32768
          deepseek-v4-pro:
            contextWindow: 354304
            maxTokens: 32768
          muse-spark-1.3-contributor:
            # Catalog: contextWindow 1048576, maxTokens 131072. Pinned for the same
            # reason, and because this model is openai-responses on the catalog route
            # — so unlike the hand-declared route it also gets the native
            # x-opencode-session header, without the third-party plugin.
            contextWindow: 354304
            maxTokens: 32768
      # Hand-declared route: ONLY the two free models, because pi-ai's baked-in
      # opencode-go catalog does not describe them and modelOverrides cannot add.
      # DeepSeek and Muse Spark come from the `opencode-go` catalog route above,
      # which carries them natively with the session header already wired.
      # This route exists solely for what the catalog is missing.
      opencode-go-free:
        displayName: OpenCode Go (Free)
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        # SESSION HEADER — do NOT add a static `headers: {x-opencode-session: ...}`
        # here. It would be a landmine, and a dead one.
        #
        # Why a header is required: this hand-declared route is built from the BARE
        # pi-ai openAICompletionsApi (dsh-llm-pi-ai/lib/index.js:803), which never
        # passes through withOpenCodeSessionHeader — that wrapper only exists inside
        # pi-ai's two catalog factories (providers/opencode-go.js, opencode.js).
        # Without the header the gateway returns 400 MissingSessionID.
        #
        # Why a static value is NOT a valid substitute: the gateway accepts
        # x-session-affinity as a session id (verified HTTP 200), and pi-ai's bare
        # transport will send exactly that header — but only when
        # `compat.sendSessionAffinityHeaders` is set, and dsh-llm-pi-ai's COMPAT_GATE
        # marks that field "withhold" (lib/index.js:403), so it cannot be configured.
        # That withheld switch is the entire reason dsh-opencode-session-header exists,
        # and the reason it cannot be removed from this profile.
        #
        # The plugin stamps a PER-CONVERSATION id at the fetch layer and overwrites
        # unconditionally (Headers.set, plugin lib/index.js:170), so a static header
        # here would never reach the wire anyway. A literal string is one id for every
        # conversation, which would silently collapse per-conversation prompt-cache
        # routing the moment the plugin is ever disabled.
        models:
          - id: space-bunny-free
            name: Space Bunny
            contextWindow: 354304
            maxTokens: 32768
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
          # Free and unlimited on the Go plan, same openai-completions endpoint as the
          # rest of this route. Every field below was probed against the live endpoint,
          # not assumed:
          #  - reasoningEfforts deliberately ABSENT. The gateway accepts every level
          #    (including "off" as a literal string, which Space Bunny rejects), but
          #    reasoning_tokens stay flat at ~189 across omit/minimal/low/medium/high/
          #    xhigh/max. The parameter is a no-op here, so a selector would advertise
          #    control that does not exist. It always reasons; nothing turns that off.
          #  - `image` deliberately ABSENT. The gateway accepts image payloads with
          #    HTTP 200, but the model misread 2 of 3 flat colour tests (blue->Black,
          #    green->Red). Declaring image would let the harness hand it images it
          #    silently misreads.
          #  - contextWindow matches the 354304 its siblings use. Measured working to
          #    444,457 prompt tokens, so there is verified headroom to raise it; the
          #    advertised 1M is UNconfirmed (a 900k probe hit a 429 throttle, which
          #    says nothing about the real ceiling).
          - id: longcat-2.5-preview-free
            name: LongCat 2.5 Preview Free
            contextWindow: 354304
            maxTokens: 32768
            input:
              - text
            # Declared at your request. Every level below was probed and accepted
            # (200) by the gateway — including a literal "off" string, which
            # Space Bunny rejects. `off: null` still omits the field, matching the
            # other rows. KNOWN LIMIT: reasoning_tokens stayed flat at ~189 across
            # all of omit/minimal/low/medium/high/xhigh/max, so the upstream model
            # appears to ignore this parameter. Expect the selector to work and the
            # model's actual thinking to stay the same.
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go-free
    model: space-bunny-free
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    fontSize: 15

# ── agent presets ───────────────────────────────────────────────────────────
# The `coding` preset is declared HERE, not as a separate bundle package: a
# bundle would need a `link:` dependency whose recorded path is absolute, and
# an absolute path breaks on any machine with a different home directory.
# 0.1.7 has no preset directory to scan, so a declaration row is the only form.
- insert:
    - id: preset-coding
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: coding
        name: Coding
        description: Debloated full coding agent — shell, files and images, skills,
          subagents, web, MCP; no plan mode, todos, workflow, ralph, fork, or
          tool-result pruning.
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: |-
                Your working directory is {{cwd}}.

                > [!CAUTION]
                > <u>**BINDING REMINDER — THE FIVE RULE SETS AT THE TOP OF THIS PROMPT ARE MANDATORY AND ARE RESTATED HERE ON PURPOSE: BE CONCISE · BE SCANNABLE · NEVER GUESS, VERIFY WITH PROOF · ASK BEFORE ANY DESTRUCTIVE GIT COMMAND · RED-GREEN-REFACTOR, 1–2 TESTS PER CYCLE.**</u>
              prefix: |-
                # STOP. THESE RULES ARE NON-NEGOTIABLE.
                # Re-read them before EVERY response and before EVERY tool call.

                > [!CAUTION]
                > <u>**EVERY RULE BELOW IS MANDATORY. IT OVERRIDES YOUR DEFAULTS, YOUR HABITS, AND EVERY SHORTCUT.**</u>
                > <u>**BREAKING A RULE IS A FAILURE EVEN WHEN THE RESULT LOOKS CORRECT.**</u>
                > <u>**WHERE A RULE AND YOUR INSTINCT DISAGREE, THE RULE WINS. ALWAYS. NO EXCEPTIONS.**</u>

                ---

                ## 1. <u>**RESPONSE STYLE**</u>

                - <u>**BE EXTREMELY CONCISE AND DIRECT.**</u> Zero conversational fluff, preamble, or sign-offs. Aim for as few words as possible while staying clear.
                - <u>**DEFAULT TO A FEW SENTENCES.**</u> Go longer ONLY when the task itself needs it.
                - <u>**NO UNNECESSARILY VERBOSE SENTENCES.**</u> Keep them short and simple, flowing straight to the point, with no filler or padding.
                - <u>**STOP WHEN THE ANSWER IS COMPLETE:**</u> no recap, no closing summary, no offer to continue.
                - <u>**EXPLAIN THROUGH HIGH-LEVEL REASONING IN PLAIN ENGLISH, BUILDING INTUITION FOR THE READER.**</u> <u>**NEVER**</u> explain with code or jargon unless explicitly asked for.

                ## 2. <u>**STRUCTURED OUTPUT & VISUALS**</u>

                - <u>**FORMAT RESPONSES FOR FAST SCANNING,**</u> but use markdown tables, itemised lists and inline code blocks only when needed.
                - <u>**AVOID LARGE BLOCKS OF TEXT. BREAK THEM DOWN.**</u>
                - <u>**USE MERMAID DAG FLOWCHARTS**</u> (`graph TD` / `graph LR`) to explain complex logics and flows.
                - <u>**DIAGRAMS CARRY THE IDEA, NOT THE IMPLEMENTATION:**</u> label each node with the plain-English step or decision it stands for, in a few words — <u>**NEVER**</u> a variable name, function call or code expression.
                - <u>**SOMEONE WHO HAS NEVER SEEN THE CODEBASE MUST BE ABLE TO FOLLOW THE FLOW FROM THE LABELS ALONE.**</u>

                ## 3. <u>**VERIFICATION**</u>

                - <u>**NEVER GUESS. NEVER ANSWER PURELY FROM MEMORY.**</u>
                - <u>**BACK UP EVERY RESPONSE WITH PROOF:**</u> run commands, run scripts, check files, run tests, web search or look up docs <u>**FIRST.**</u>
                - <u>**IF YOU LACK THE TOOL OR COMMAND TO CHECK SOMETHING, STOP AND ASK TO INSTALL OR ENABLE IT FIRST.**</u> <u>**NEVER**</u> guess instead.

                ## 4. <u>**GIT OPERATIONS**</u>

                - <u>**RUN VIEW-ONLY COMMANDS (`status`, `diff`, `log`) STRAIGHT AWAY, WITHOUT ASKING.**</u>
                - <u>**ALWAYS ASK BEFORE RUNNING ANY DESTRUCTIVE COMMAND**</u> (`commit`, `push`, `reset`, `rebase`, `branch -D`). <u>**NO EXCEPTIONS.**</u>

                ## 5. <u>**TEST-DRIVEN DEVELOPMENT (TDD)**</u>

                - <u>**KEEP RED-GREEN-REFACTOR CYCLES SMALL: 1 OR 2 TESTS PER CYCLE. NEVER BATCH-WRITE TESTS.**</u>
                - <u>**WRITE THE MINIMUM IMPLEMENTATION CODE NEEDED TO PASS THE NEW TEST.**</u> <u>**NO FEATURE MAY BE WRITTEN WITHOUT A TEST THAT NEEDS IT.**</u>
                - <u>**REFACTORING IS MANDATORY EVERY CYCLE:**</u> remove duplicate code, fix naming, and strip dead code <u>**BEFORE**</u> moving to the next test.

                ---

                > [!IMPORTANT]
                > <u>**FINAL GATE — CONFIRM ALL FIVE BEFORE YOU SEND ANY RESPONSE:**</u>
                > <u>**1. As short as it can be? · 2. Scannable? · 3. Verified with proof, not guessed? · 4. Asked before anything destructive? · 5. Red-green-refactor respected, 1–2 tests per cycle?**</u>
                > <u>**IF ANY ANSWER IS NO, FIX IT BEFORE YOU RESPOND.**</u>

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: it publishes `DSH_WEB_URL` and the
          # other `DSH_*` facts, and a host row that injects a service is the criterion
          # for host-plane ownership. Both shell tools consume the host registry from
          # here; their executors (`bash-sandbox`/`pwsh-sandbox`) are host-plane too.
          # Background work needs the host job runtime, and `tool-jobs` below is the
          # model-facing half of it.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Registers into the host `tools` registry and provides nothing, so it needs no
          # realm. The `fs` service and its policy stay in the host. `read_image` is the
          # reason this row stays whole — see the header.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset,
          # and `tool-skill` gives them the catalog and loader; the merged catalog also
          # carries whatever the deployment registered globally.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          # `/goal` lets the person create and steer a goal; `tool-goal` gives the model
          # the matching `get_goal`/`create_goal`/`update_goal` tools, and the host-plane
          # round driver continues the session on an active goal. Both rows are
          # preset-scoped on purpose: `dsh-web-app` disables the command and tool rows on
          # the host plane, while the goal service and its session driver stay there.
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── compaction ──────────────────────────────────────────────────────────────

          # NO tool-result pruner. Oversized results are bounded upstream by the host
          # spill policy (a preview plus a retrievable file), and whatever stays inline is
          # compacted as history rather than trimmed in place. `tokenMeter` is
          # deliberately NOT in this realm: the meter stays on the HOST plane and the row
          # here resolves that one instance, because it owns context-meter projection
          # units the browser reads for every session.
          #
          # `compaction-basic` is left at its defaults ON PURPOSE — no thresholdRatio
          # here, because a top-level ratio would retune every routed model, not just
          # this one. The 256k trigger is set from the DeepSeek model row's
          # `contextWindow` instead; see the comment there for the arithmetic.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

          # ── delegation ──────────────────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # No isolate realm here: with the workflow rows gone, nothing in this group
          # publishes a service, and a realm would only fence the rows off from the host
          # capability they consume. Children start clean — the fork row is absent.
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              # Production dsh does not install these optional providers. Install the
              # matching Bundle in this Profile and restart the Host, then remove
              # `disabled` from the row. Host availability alone grants no tool.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

          # ── remaining model-facing rows ─────────────────────────────────────────────

          # Disabled on request: the question modal interrupts the turn, and the
          # model can ask in prose and stop instead. Flip `disabled` to restore.
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            disabled: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # ── MCP ─────────────────────────────────────────────────────────────────────

          # One row per external MCP server; its tools appear to the model as
          # `mcp__<serverName>__<tool>`. This row is a DISABLED template: set
          # `serverName` and the transport, then remove `disabled`. Every enabled server
          # adds its tool schemas to every request, and a stdio server runs a local
          # program, so enable only what is needed.
          - id: mcp-example
            name: '@deepseek-ai/dsh-mcp-client'
            disabled: true
            config:
              serverName: example
              transport: stdio
              command: npx
              args: [ '-y', '@modelcontextprotocol/server-filesystem', '/Users/mac/repos' ]
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: coding
- id: speech-to-text
  name: "@deepseek-ai/dsh-experimental-speech-to-text"
  config:
    defaultProvider: sensevoice-local
    language: en
