# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
      # Declared route: the installed pi-ai catalog does not describe
      # deepseek-v4.1-flash, and a declared `models` list replaces the served
      # catalog, so this route carries its own openai-completions models and
      # leaves `opencode-go` (all other Go models) intact.
      opencode-go-deepseek:
        displayName: OpenCode Go (DeepSeek)
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            # Declared BELOW the previous 500000 on purpose: the window is the only
            # knob that moves the auto-compaction trigger without touching the
            # compaction plugin, whose settings every routed model shares.
            # dsh-compaction-basic fires at `min(thresholdRatio x contextWindow,
            # contextWindow - maxTokens - headroomTokens (65536))`, thresholdRatio
            # defaulting to 0.8. The clamp binds for any window under 491520, so the
            # trigger is simply `window - 98304`:
            #   354304 - 32768 - 65536 = 256000 -> summarized at exactly 256k, while
            #   0.8 x 354304 = 283443 stays out of the way.
            # Consequences of using the window rather than the ratio: the context
            # meter reads against 354304, not 500000, and the verbatim tail kept per
            # compaction is 16% of the (smaller) message budget, ~51.4k tokens
            # instead of ~74.7k. Declaring 500000 would trigger at 400000; declaring
            # 256000 would hand the decision to the clamp and fire at 157696. To
            # retune, move the window by the same delta.
            # maxTokens is the OUTPUT RESERVATION, not an output ceiling.
            contextWindow: 354304
            maxTokens: 32768
            # Vision verified against the live endpoint: a solid magenta 64x64 PNG
            # answered "Magenta", while the same question with no image answered
            # "Unknown". deepseek-v4-pro rejects image parts outright ("this model
            # does not support image input"), so it keeps the text-only default.
            input: [text, image]
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              maxTokensField: max_tokens
              requiresReasoningContentOnAssistantMessages: true
              thinkingFormat: deepseek
          - id: deepseek-v4-flash
          - id: deepseek-v4-pro
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go-deepseek
    model: deepseek-v4.1-flash
    reasoningEffort: max
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    fontSize: 15

# ── agent presets ───────────────────────────────────────────────────────────
# The `coding` preset is declared HERE, not as a separate bundle package: a
# bundle would need a `link:` dependency whose recorded path is absolute, and
# an absolute path breaks on any machine with a different home directory.
# 0.1.7 has no preset directory to scan, so a declaration row is the only form.
- insert:
    - id: preset-coding
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: coding
        name: Coding
        description: Debloated full coding agent — shell, files and images, skills,
          subagents, web, MCP; no plan mode, todos, workflow, ralph, fork, or
          tool-result pruning.
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |-
                ## Response Style
                - Extremely concise and direct. Zero conversational fluff, preamble, or sign-offs. Aim for as few words as possible while staying clear.
                - Default to a few sentences. Go longer only when the task itself needs it.
                - No unnecessarily verbose sentences. Keep them short and simple, flowing straight to the point, with no filler or padding.
                - Stop when the answer is complete: no recap, no closing summary, no offer to continue.
                - Explain through high-level reasoning in plain English, building intuition for the reader. Never explain with code or jargon unless explicitly asked for.

                ## Structured Output & Visuals
                - Format responses for fast scanning, but use markdown tables, itemised lists, arrows and inline code blocks only when needed.
                - Avoid large blocks of text, break it down.
                - Use Mermaid DAG flowcharts (`graph TD` / `graph LR`) to explain complex logics and flows.

                ## Verification
                - Never guess or answer purely from memory.
                - Back up every response with proof: run commands, run scripts, check files, run tests, web search or look up docs first.
                - If you lack the tool or command to check something, ask to install or enable it first instead of guessing.

                ## Git Operations
                - Run view-only commands (`status`, `diff`, `log`) straight away without asking.
                - Always ask before running destructive commands (`commit`, `push`, `reset`, `rebase`, `branch -D`).

                ## Test-Driven Development (TDD)
                - Keep red-green-refactor cycles small: 1 or 2 tests per cycle. Never batch-write tests.
                - Write the minimum implementation code needed to pass the new test. Make sure no feature is written without a test needing it.
                - Refactoring is mandatory every cycle: remove duplicate code, fix naming, and strip dead code before moving to the next test.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: it publishes `DSH_WEB_URL` and the
          # other `DSH_*` facts, and a host row that injects a service is the criterion
          # for host-plane ownership. Both shell tools consume the host registry from
          # here; their executors (`bash-sandbox`/`pwsh-sandbox`) are host-plane too.
          # Background work needs the host job runtime, and `tool-jobs` below is the
          # model-facing half of it.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Registers into the host `tools` registry and provides nothing, so it needs no
          # realm. The `fs` service and its policy stay in the host. `read_image` is the
          # reason this row stays whole — see the header.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset,
          # and `tool-skill` gives them the catalog and loader; the merged catalog also
          # carries whatever the deployment registered globally.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          # `/goal` lets the person create and steer a goal; `tool-goal` gives the model
          # the matching `get_goal`/`create_goal`/`update_goal` tools, and the host-plane
          # round driver continues the session on an active goal. Both rows are
          # preset-scoped on purpose: `dsh-web-app` disables the command and tool rows on
          # the host plane, while the goal service and its session driver stay there.
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── compaction ──────────────────────────────────────────────────────────────

          # NO tool-result pruner. Oversized results are bounded upstream by the host
          # spill policy (a preview plus a retrievable file), and whatever stays inline is
          # compacted as history rather than trimmed in place. `tokenMeter` is
          # deliberately NOT in this realm: the meter stays on the HOST plane and the row
          # here resolves that one instance, because it owns context-meter projection
          # units the browser reads for every session.
          #
          # `compaction-basic` is left at its defaults ON PURPOSE — no thresholdRatio
          # here, because a top-level ratio would retune every routed model, not just
          # this one. The 256k trigger is set from the DeepSeek model row's
          # `contextWindow` instead; see the comment there for the arithmetic.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

          # ── delegation ──────────────────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # No isolate realm here: with the workflow rows gone, nothing in this group
          # publishes a service, and a realm would only fence the rows off from the host
          # capability they consume. Children start clean — the fork row is absent.
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              # Production dsh does not install these optional providers. Install the
              # matching Bundle in this Profile and restart the Host, then remove
              # `disabled` from the row. Host availability alone grants no tool.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

          # ── remaining model-facing rows ─────────────────────────────────────────────

          # Disabled on request: the question modal interrupts the turn, and the
          # model can ask in prose and stop instead. Flip `disabled` to restore.
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            disabled: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # ── MCP ─────────────────────────────────────────────────────────────────────

          # One row per external MCP server; its tools appear to the model as
          # `mcp__<serverName>__<tool>`. This row is a DISABLED template: set
          # `serverName` and the transport, then remove `disabled`. Every enabled server
          # adds its tool schemas to every request, and a stdio server runs a local
          # program, so enable only what is needed.
          - id: mcp-example
            name: '@deepseek-ai/dsh-mcp-client'
            disabled: true
            config:
              serverName: example
              transport: stdio
              command: npx
              args: [ '-y', '@modelcontextprotocol/server-filesystem', '/Users/mac/repos' ]
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: coding
